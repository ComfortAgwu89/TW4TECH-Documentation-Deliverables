name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
      - name: Enable GitHub Pages on gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: "gh-pages", path: "/" };
            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source,
              });
              core.info("GitHub Pages site created (gh-pages /).");
            } catch (error) {
              const status = error.status || error.response?.status;
              if (status === 409) {
                try {
                  await github.rest.repos.updateInformationAboutPagesSite({
                    owner,
                    repo,
                    build_type: "legacy",
                    source,
                  });
                  core.info("GitHub Pages already existed; source set to gh-pages.");
                } catch (updateError) {
                  core.warning(String(updateError));
                }
              } else {
                core.warning(String(error));
              }
            }
